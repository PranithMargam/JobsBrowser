name: JobsBrowser
options:
  bundleIdPrefix: com.codex
  deploymentTarget:
    iOS: 17.0
settings:
  base:
    SWIFT_VERSION: 5.0
    DEVELOPMENT_TEAM: ""
targets:
  JobsBrowser:
    type: application
    platform: iOS
    sources:
      - path: Sources/JobsBrowser
    resources:
      - path: Sources/JobsBrowser/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.codex.jobsbrowser
        PRODUCT_NAME: JobsBrowser
        INFOPLIST_FILE: Sources/JobsBrowser/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
        CODE_SIGN_STYLE: Automatic
  JobsBrowserTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/JobsBrowserTests
    resources:
      - path: Tests/JobsBrowserTests/Resources
    dependencies:
      - target: JobsBrowser
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.codex.jobsbrowser.tests
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
  JobsBrowserUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/JobsBrowserUITests
    dependencies:
      - target: JobsBrowser
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.codex.jobsbrowser.uitests
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
